[package]
name = "superdrop"
version = "0.1.0"
description = "Fast peer-to-peer file sharing on local networks"
authors = ["SuperDrop contributors"]
edition = "2021"

[lib]
name = "superdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hostname = "0.4"
local-ip-address = "0.6"
mdns-sd = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
